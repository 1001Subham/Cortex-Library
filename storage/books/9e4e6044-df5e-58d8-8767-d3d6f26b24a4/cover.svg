<svg xmlns="http://www.w3.org/2000/svg" width="320" height="480" viewBox="0 0 320 480"><rect width="320" height="480" fill="#6b3a1f"/><rect x="18" y="18" width="284" height="444" fill="none" stroke="#f5f0e8" stroke-width="2"/><g><text x="160" y="130" text-anchor="middle" fill="#f5f0e8" font-family="Georgia,serif" font-size="22">The Odyssey:</text>
